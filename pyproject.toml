[project]
name = "collaborative-auditor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aisitools",
    "anthropic>=0.109.1",
    "fastapi>=0.132.0",
    "inspect-ai>=0.3.180",
    "inspect-petri",
    "ipython>=9.14.1",
    "plotly>=6.8.0",
    "pydantic>=2.12.5",
    "shortuuid>=1.0.13",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
]

[project.scripts]
workbench = "workbench.server:main"

[project.entry-points.inspect_ai]
workbench = "workbench.m1.wb_display"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["workbench"]

[tool.uv.sources]
inspect-ai = { path = "../inspect_ai", editable = true }
inspect-petri = { path = "../petri-meridian", editable = true }
aisitools = { git = "ssh://git@github.com/AI-Safety-Institute/aisi-inspect-tools.git" }

[dependency-groups]
dev = [
    "anyio>=4.8.0",
    "nbformat>=5.10.4",
    "playwright>=1.60.0",
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default selection excludes subprocess-heavy and real-API tests; run those
# explicitly with ``-m slow`` / ``-m real_model`` (or ``-m ''`` for everything).
addopts = "-m 'not slow and not real_model'"
markers = [
    "slow: subprocess / multi-second (hybrid, coverage)",
    "real_model: hits the real Anthropic API (e2e)",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "A", "BLE", "SLF",
    "ARG", "ANN2", "S",
]
ignore = [
    "PLC0415",  # lazy imports — structural
    "PLC2701",  # private-dep imports — structural
    "PLR2004",  # magic values
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
    "PLR0913",  # too many args
    "S101",     # assert
    "E501",     # line-too-long — no formatter-enforced wrap
    "ARG002",   # unused method arg — protocol signatures (_repr_mimebundle_, Display)
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode — ×/…/→ are intentional
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"src/workbench/_smoke*.py" = ["SLF001", "PLR0915", "BLE001", "ANN", "S", "ARG", "PLW0603"]
"src/workbench/_screenshot*.py" = ["SLF001", "PLR0915", "BLE001", "ANN", "S", "ARG"]
"src/workbench/_e2e_*.py" = ["SLF001", "PLR0915", "BLE001", "ANN", "S", "ARG"]
"src/workbench/m1/_fixtures.py" = ["SLF001", "ANN", "ARG"]
"src/workbench/m1/_audit_task.py" = ["ARG"]
"tests/**" = ["SLF001"]

[tool.uv]
# exclude-newer-package overrides removed — orphaned without a global
# ``exclude-newer`` and forced a re-resolve that failed against the
# editable inspect_ai fork's ``0.1.dev1+…`` version (e2e worker).
