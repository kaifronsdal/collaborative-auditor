[project]
name = "collaborative-auditor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.83.0",
    "fastapi>=0.132.0",
    "inspect-ai>=0.3.180",
    "jsonpatch>=1.33",
    "openai>=2.24.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
]

[project.scripts]
collaborative-auditor = "collaborative_auditor.server:run_server"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
